---
# Engine RBAC for starrocks-ace-engine, checked by ace-hub ValidateEngineRBAC.
# ace-hub binds both objects to the EngineInstance ServiceAccount. ace-operator
# applies the engine template as that ServiceAccount, and Flux helm-controller
# impersonates it for chart workloads (HelmRelease.spec.serviceAccountName).
# The kube-starrocks operator runs as that ServiceAccount (engine.yaml) with
# starrocksOperator.watchNamespace set; chart RBAC is not created.
#
# ClusterRole: cluster-scoped grants only. No HelmRepository or HelmRelease
# rules. ace-operator applies those objects as itself. A ClusterRole rule on
# them is a grant in every namespace, including flux-system (AWC-6150).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: starrocks-ace-engine-role
rules:
  # kube-starrocks ships StarRocks CRDs under charts/operator/crds/; Flux installs
  # them with CreateReplace impersonating the engine SA (ace-operator AWC-5129).
  # No delete: uninstall must not cascade-delete every StarRocksCluster.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - get
      - patch
      - update

---
# Namespaced writes: engine template (AuthConfig, HTTPRoute), Helm release
# objects, and the StarRocks operator's reconcile loop in the instance namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: starrocks-ace-engine-namespaced-role
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Helm --wait reads ReplicaSets to judge Deployment readiness.
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - starrocks.com
    resources:
      - starrocksclusters
      - starrockswarehouses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - starrocks.com
    resources:
      - starrocksclusters/finalizers
      - starrockswarehouses/finalizers
    verbs:
      - update
  - apiGroups:
      - starrocks.com
    resources:
      - starrocksclusters/status
      - starrockswarehouses/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - security.awc.cloudera.com
    resources:
      - authconfigs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
