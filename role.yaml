---
# Engine RBAC for starrocks-ace-engine, shaped for strict ACE RBAC (ace-hub
# ValidateEngineRBAC). ace-hub binds both objects to the EngineInstance SA,
# ace-operator, helm-controller and product operators. Under strict mode the
# kube-starrocks operator runs as that SA (engine.yaml) with
# starrocksOperator.watchNamespace set; chart RBAC is not created.
# Legacy mode applies these documents as written; the ClusterRoleBinding is
# tolerated locally for ace-operator-only development (ace-hub drops bindings).
#
# ClusterRole: cluster-scoped grants only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: starrocks-ace-engine-role
rules:
  # Flux chart runtime objects ace-operator creates for this release.
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - helmrepositories
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # kube-starrocks ships StarRocks CRDs under charts/operator/crds/; Flux installs
  # them with CreateReplace impersonating the engine SA (ace-operator AWC-5129).
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - get
      - patch
      - update

---
# Namespaced writes: engine template (AuthConfig, HTTPRoute), Helm release
# objects, and the StarRocks operator's reconcile loop in the instance namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: starrocks-ace-engine-namespaced-role
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Helm --wait reads ReplicaSets to judge Deployment readiness.
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - starrocks.com
    resources:
      - starrocksclusters
      - starrockswarehouses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - starrocks.com
    resources:
      - starrocksclusters/finalizers
      - starrockswarehouses/finalizers
    verbs:
      - update
  - apiGroups:
      - starrocks.com
    resources:
      - starrocksclusters/status
      - starrockswarehouses/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - security.awc.cloudera.com
    resources:
      - authconfigs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
